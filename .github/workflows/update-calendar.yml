name: Update Slovak calendar

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install astronomy library
        run: pip install skyfield

      - name: Generate calendar
        run: python calendar_generator.py

      - name: Save updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robert-kalendar.ics
          git diff --cached --quiet || (git commit -m "Automatic calendar update" && git push)
